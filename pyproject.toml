[project]
name = "eu-tax-revenue-sources"
version = "0.1.0"
description = "EU tax revenue sources by country"
requires-python = ">=3.15"
dependencies = [
    "altair>=6.3.0",
    "marimo>=0.25.2",
    "polars>=2.1.0",
    "pyarrow>=23.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint.per-file-ignores]
# Marimo shows the last expression of a cell and keeps an explicit return.
"notebooks/*.py" = ["B018", "PLR1711"]
